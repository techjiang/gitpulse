name: Discussion create
on:
  workflow_dispatch:
permissions:
  contents: read
  discussions: write
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create discussion as bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/create-discussion.js
